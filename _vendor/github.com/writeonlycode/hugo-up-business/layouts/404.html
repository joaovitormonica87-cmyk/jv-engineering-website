{{ define "main" }}
<section class="flex min-h-[75vh] flex-col items-center justify-center text-center px-4 py-20 bg-[#0a0f1d] text-white">

  <!-- Número 404 em Gradiente Azul -->
  <h1
    class="text-8xl xl:text-9xl font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-blue-600 mb-2 tracking-wider drop-shadow-lg">
    404
  </h1>

  <!-- Título de Alerta -->
  <h2 class="text-2xl xl:text-4xl font-bold mb-4 text-white">
    Página Não Encontrada
  </h2>

  <!-- Subtítulo Explicativo -->
  <p class="text-gray-300 max-w-md mb-8 text-base xl:text-lg leading-relaxed">
    Ops! A página que você está procurando não existe, foi removida ou o endereço mudou.
  </p>

  <!-- Botão de Retorno para a Home -->
  <a href="{{ site.BaseURL }}"
    class="inline-flex items-center gap-2 bg-blue-600 hover:bg-blue-500 text-white font-semibold px-6 py-3 rounded-lg duration-300 shadow-lg shadow-blue-600/25">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
    </svg>
    Voltar para o Início
  </a>

</section>
{{ end }}
