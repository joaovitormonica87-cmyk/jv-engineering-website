title: "Muito além de uma entrega"
subtitle: "Uma parceria estratégica durante toda a sua jornada acadêmica"
text: "A JV Engineering nasceu para resolver um problema claro das graduações em STEM: a falta de suporte prático e direcionado em disciplinas de alta complexidade. Mais do que resolver uma atividade pontual, construímos uma relação de confiança com rigor técnico, clareza didática e foco no aprendizado real do aluno."